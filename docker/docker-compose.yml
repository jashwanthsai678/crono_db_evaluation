# Self-hosted platforms, each capped to CognoDB's free-tier spec where possible: 0.5 vCPU /
# 256MB RAM. Disk isn't hard-capped here — Docker on Windows doesn't have a reliable per-volume
# quota — so instead the dataset is sized to fit comfortably and actual disk usage gets measured
# after loading rather than enforced up front.
#
# ArangoDB and Dgraph both needed more memory than that once I actually tested them, not just
# assumed it would be fine. Full story in README.md section 2, but the short version:
#   - ArangoDB: bumped to 512MB. Got OOM-killed about 6 seconds into the query workload at 256MB.
#   - Dgraph's alpha node: bumped to 2GB. Got OOM-killed three separate times (schema setup,
#     mid-load, mid-workload) before it finally stayed up. Dgraph also runs as two processes —
#     zero (cluster coordinator) and alpha (the actual database) — and zero was never a problem,
#     staying well under 128MB the whole time.

services:
  neo4j:
    image: neo4j:5-community
    container_name: bench-neo4j
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: neo4j/benchmarkpass
      NEO4J_server_memory_heap_initial__size: 96m
      NEO4J_server_memory_heap_max__size: 96m
      NEO4J_server_memory_pagecache_size: 32m
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    volumes:
      - neo4j_data:/data

  memgraph:
    image: memgraph/memgraph:latest
    container_name: bench-memgraph
    ports:
      - "7688:7687"
    command: ["--memory-limit=200"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    volumes:
      - memgraph_data:/var/lib/memgraph

  arangodb:
    image: arangodb:3.12
    container_name: bench-arangodb
    ports:
      - "8529:8529"
    environment:
      ARANGO_ROOT_PASSWORD: benchmarkpass
    deploy:
      resources:
        limits:
          cpus: "0.5"
          # Bumped from 256MB after it got OOM-killed ~6s into the query workload — loading
          # alone already left it sitting at ~99% memory with nothing in reserve. See README
          # section 2 for the full story.
          memory: 512M
    volumes:
      - arango_data:/var/lib/arangodb3

  dgraph-zero:
    image: dgraph/dgraph:latest
    container_name: bench-dgraph-zero
    command: ["dgraph", "zero", "--my=dgraph-zero:5080"]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    volumes:
      - dgraph_zero_data:/dgraph

  dgraph-alpha:
    image: dgraph/dgraph:latest
    container_name: bench-dgraph-alpha
    command: ["dgraph", "alpha", "--my=dgraph-alpha:7080", "--zero=dgraph-zero:5080", "--security", "whitelist=0.0.0.0/0"]
    ports:
      - "8080:8080"
      - "9080:9080"
    depends_on:
      - dgraph-zero
    deploy:
      resources:
        limits:
          cpus: "0.5"
          # Took three tries to land here: OOM-killed at 256MB during schema setup, OOM-killed
          # again at 512MB mid-load, then OOM-killed a third time at 1GB — this time mid-workload,
          # after loading and the traversal/point-lookup queries had already worked fine. 2GB is
          # where it finally stayed up through everything. See README section 2.
          memory: 2048M
    volumes:
      - dgraph_alpha_data:/dgraph

volumes:
  neo4j_data:
  memgraph_data:
  arango_data:
  dgraph_zero_data:
  dgraph_alpha_data:
